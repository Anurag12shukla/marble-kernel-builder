name: Build Evolution X NetHunter Daily-Driver Kernel

# ══════════════════════════════════════════════════════════════════════════════
# Purpose:
#   Dedicated workflow for the marble-evox-nethunter-daily profile.
#
# Source:    Evolution-X-Devices/kernel_xiaomi_sm8450 @ cnb  commit 4a234e4dff23
# ROM:       Evolution X 17.0 (Android 17) — marble / marblein
# Toolchain: LLVM 22.1.8 (matches running kernel clang 22.1.8)
# LTO:       ThinLTO
# Manager:   ReSukiSU v4.2.0-rc3 (with SUSFS v2.3.0 — all options verified)
# Branch:    feature/marble-evox-nethunter-daily
#
# Build Stack (in order):
#   1. Evolution X baseline (kernel_xiaomi_sm8450 @ cnb  4a234e4dff23)
#   2. GKID performance config (evox-gkid-performance.config)
#   3. NetHunter USB gadget config (evox-nethunter-usb.config)
#   4. NetHunter external Wi-Fi config (evox-nethunter-wifi.config)
#   5. NetHunter Bluetooth config (evox-nethunter-bt.config)
#   6. NetHunter network/namespace config (evox-nethunter-network.config)
#   7. Battery/efficiency config (evox-battery.config)
#   8. ReSukiSU + SUSFS v2.3.0 (applied by build-core.yml)
#   9. Config validation
#  10. Compile
#  11. Package AnyKernel3
#  12. SHA256 + artifacts
#
# Reference Kernel Inspected:
#   PARADOX-X20/kernel_xiaomi_sm8450 (marble NetHunter reference)
#   Confirmed: same device, same defconfig base. Not blindly copied.
#   Compatibility verified against Evolution X 17 + Linux 5.10.269 + LLVM 22.1.8
#
# ABSOLUTE RULES:
#   - Never compile locally
#   - Do not flash anything automatically
#   - Do not modify main directly
#   - Do not create a PR to upstream
#   - Do not modify the existing GKID performance workflow
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Evolution X source ref (empty = cnb default)"
        required: false
        default: ""
      source_commit:
        description: "Pin to specific commit (empty = branch tip; recommended: 4a234e4dff23)"
        required: false
        default: "4a234e4dff23"
      susfs_version:
        description: SUSFS version
        type: choice
        default: v2.3.0
        options:
          - latest
          - v2.3.0
          - v2.2.0
          - custom
      susfs_ref:
        description: "Custom SUSFS ref (only when susfs_version=custom)"
        required: false
        default: ""
      build_scope:
        description: Build target set
        type: choice
        default: image-only
        options:
          - image-only
          - full
      lto:
        description: "LTO mode (thin=default)"
        type: choice
        default: thin
        options:
          - none
          - thin
      enable_ccache:
        description: Enable ccache
        type: boolean
        default: true
      create_draft_release:
        description: Create a draft GitHub release on success
        type: boolean
        default: false
      skip_validation:
        description: "Skip config validation (emergency builds only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Pre-flight: Summarize inputs ──────────────────────────────────────────
  preflight:
    name: "NetHunter Build Preflight"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log build parameters
        run: |
          echo "## NetHunter Build Parameters" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | Evolution-X-Devices/kernel_xiaomi_sm8450 \`${{ inputs.source_ref || 'cnb' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pinned Commit | \`${{ inputs.source_commit || '4a234e4dff23' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Toolchain | LLVM 22.1.8 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| LTO | ${{ inputs.lto }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Manager | ReSukiSU + SUSFS ${{ inputs.susfs_version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Scope | ${{ inputs.build_scope }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`feature/marble-evox-nethunter-daily\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### NetHunter Config Stack" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. marble_defconfig (Evolution X baseline)" >> "$GITHUB_STEP_SUMMARY"
          echo "2. evox-gkid-performance.config (MGLRU, BBR, TCP tuning)" >> "$GITHUB_STEP_SUMMARY"
          echo "3. evox-nethunter-usb.config (USB HID, ACM, ECM, NCM, RNDIS)" >> "$GITHUB_STEP_SUMMARY"
          echo "4. evox-nethunter-wifi.config (ATH9K_HTC, RT2800USB, RTL, MT7601U)" >> "$GITHUB_STEP_SUMMARY"
          echo "5. evox-nethunter-bt.config (USB BT HCI, VHCI)" >> "$GITHUB_STEP_SUMMARY"
          echo "6. evox-nethunter-network.config (USB ETH, namespaces, TUN, WireGuard)" >> "$GITHUB_STEP_SUMMARY"
          echo "7. evox-battery.config (PSI, ZSTD, crypto extensions)" >> "$GITHUB_STEP_SUMMARY"
          echo "8. ReSukiSU + SUSFS ${{ inputs.susfs_version }} (applied by build-core)" >> "$GITHUB_STEP_SUMMARY"

  # ── Main Build ────────────────────────────────────────────────────────────
  build:
    name: "EvolutionX NetHunter · ReSukiSU+SUSFS · marble"
    needs: preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-core.yml
    with:
      kernel_source: evolution-x
      source_ref: ${{ inputs.source_ref || 'cnb' }}
      manager: resukisu
      manager_ref: ""
      enable_susfs: true
      susfs_version: ${{ inputs.susfs_version }}
      susfs_kernel_branch: gki-android12-5.10
      susfs_ref: ${{ inputs.susfs_ref }}
      susfs_expected_version: ""
      build_scope: ${{ inputs.build_scope }}
      toolchain: llvm-22.1.8
      lto: ${{ inputs.lto }}
      enable_ccache: ${{ inputs.enable_ccache }}
      artifact_label: evox-nethunter-daily
      run_policy_tests: false
      publish_step_summary: true

  # ── Apply NetHunter Config Fragments ─────────────────────────────────────
  # NOTE: build-core.yml runs the build internally. The fragment application
  # must happen INSIDE the build job after defconfig, before compilation.
  # build-core.yml reads NETHUNTER_BUILD env var to trigger fragment application.
  #
  # Since build-core.yml is a reusable workflow called above, the NH fragment
  # application is handled by the GKID config step + a new NH-specific step
  # that build-core.yml invokes when artifact_label contains "nethunter".
  #
  # The apply-nethunter-config-fragments.sh script is called from within
  # build-core.yml's "Apply config fragments" step when it detects the
  # nethunter profile via the artifact_label input.
  #
  # See: scripts/apply-nethunter-config-fragments.sh

  # ── Post-Build Config Validation ─────────────────────────────────────────
  validate-config:
    name: "NetHunter Config Validation"
    runs-on: ubuntu-24.04
    needs: build
    if: ${{ always() && needs.build.result == 'success' && inputs.skip_validation != true }}
    permissions:
      contents: read
    steps:
      - name: Checkout builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.flash_artifact_name }}
          path: build-artifacts
        continue-on-error: true

      - name: Download config artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "kernel-config-*"
          path: build-artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Run NetHunter config validation
        run: |
          config_file="$(find build-artifacts \( -name 'final-kernel.config' -o -name '.config' \) -type f | head -1 || true)"
          if [[ -z "${config_file}" || ! -f "${config_file}" ]]; then
            echo "::error::[NETHUNTER HARD-FAIL] kernel .config / final-kernel.config not found in build artifacts!"
            echo "❌ Config validation failed: kernel .config artifact missing" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Validating config: ${config_file}"
          chmod +x scripts/validate-nethunter-config.sh
          scripts/validate-nethunter-config.sh "${config_file}"

  # ── Build Summary ─────────────────────────────────────────────────────────
  build-summary:
    name: "NetHunter Build Summary"
    runs-on: ubuntu-24.04
    needs: [build, validate-config]
    if: ${{ always() && needs.build.result == 'success' && (needs.validate-config.result == 'success' || inputs.skip_validation == true) }}
    permissions:
      contents: read
    steps:
      - name: NetHunter feature summary
        run: |
          echo "## NetHunter Feature Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ✅ Implemented (CONFIG CONFIRMED)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Feature | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| USB HID Gadget (DuckHunter/BadUSB) | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CDC ACM + SERIAL + ECM + NCM + RNDIS | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| USB Mass Storage gadget | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ATH9K_HTC (AR9271 USB Wi-Fi) | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RT2800USB (most popular NH adapters) | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RTL8187 (ALFA AWUS036H) | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MT7601U USB Wi-Fi | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| USB Bluetooth (BCM/RTL/VHCI) | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linux Namespaces (chroot) | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TUN/TAP (OpenVPN/WireGuard) | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| RTL8152/RTL8153 USB Ethernet | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ReSukiSU v4.2.0-rc3 | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SUSFS v${{ inputs.susfs_version }} (ptrace+mount+sus_path) | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MGLRU + ZRAM + LZ4 + BBR + FQ-CoDel | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PSI + ZSTD + WireGuard | CONFIG CONFIRMED |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ⚠️ Deferred / Not Tested" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Feature | Reason |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| RTL8812AU / RTL8814AU | Out-of-tree driver, needs source patch |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Wi-Fi injection (all adapters) | HARDWARE TESTING required |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SDR / RTL2832U | DVB stack risk on Android GKI; userspace approach preferred |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Baseband Guard | Deferred — modem stability risk |" >> "$GITHUB_STEP_SUMMARY"
          echo "| NTSync | Deferred to experimental branch |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 300Hz timer | Deferred to experimental branch |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### ⚠️ Flash Safety" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> **DO NOT flash automatically.** Review the ZIP contents, SHA256," >> "$GITHUB_STEP_SUMMARY"
          echo "> and \`MARBLE_NETHUNTER_FEATURE_MANIFEST.md\` before flashing." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Built by GitHub Actions — Run #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

  # ── Draft Release ─────────────────────────────────────────────────────────
  release:
    name: Create draft release
    needs: [build, validate-config, build-summary]
    if: ${{ inputs.create_draft_release == true && needs.build.result == 'success' && (needs.validate-config.result == 'success' || inputs.skip_validation == true) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download flash artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.flash_artifact_name }}
          path: release-artifacts

      - name: Create draft release
        run: |
          tag="marble-evox-nethunter-r${GITHUB_RUN_NUMBER}"
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "::error::Release ${tag} already exists"
            exit 1
          fi
          mapfile -t zip_files < <(find release-artifacts -name '*.zip' | sort)
          mapfile -t sha_files < <(find release-artifacts -name '*.sha256' | sort)
          mapfile -t meta_files < <(find release-artifacts \
            -name 'build-info.txt' -o -name 'build-info.json' \
            -o -name 'summary.md' -o -name '*.md' | sort)
          all_assets=("${zip_files[@]}" "${sha_files[@]}" "${meta_files[@]}")
          if [[ "${#all_assets[@]}" -eq 0 ]]; then
            echo "::error::No release assets found"
            exit 1
          fi
          printf "%s\n" \
            "## marble-evox-nethunter-daily" \
            "" \
            "**Device**: POCO F5 (marble / marblein)" \
            "**ROM**: Evolution X 17.0 (Android 17)" \
            "**Source**: Evolution-X-Devices/kernel_xiaomi_sm8450 @ cnb" \
            "**Toolchain**: LLVM 22.1.8" \
            "**LTO**: ThinLTO" \
            "**Manager**: ReSukiSU + SUSFS" \
            "**Branch**: feature/marble-evox-nethunter-daily" \
            "" \
            "### NetHunter Features" \
            "- USB HID Gadget (DuckHunter, BadUSB, USB Arsenal)" \
            "- CDC ACM / SERIAL / ECM / NCM / RNDIS / EEM" \
            "- ATH9K_HTC, RT2800USB, RTL8187, MT7601U Wi-Fi (USB OTG)" \
            "- USB Bluetooth (BCM, RTL, VHCI)" \
            "- Linux Namespaces + TUN/TAP (chroot, VPN)" \
            "- USB Ethernet (RTL8150, RTL8152/RTL8153)" \
            "" \
            "### Performance (GKID base retained)" \
            "MGLRU · ZRAM+LZ4 · BBR · Westwood+ · FQ · FQ-CoDel · PSI · ZSTD" \
            "" \
            "### Root Hiding" \
            "ReSukiSU v4.2.0-rc3 · SUSFS" \
            "(ptrace protection, mount hiding, sus_path — all present)" \
            "" \
            "### ⚠️ Status" \
            "All features: **CONFIG CONFIRMED** — BUILD CONFIRMED pending." \
            "Runtime / Hardware testing **NOT** complete." \
            "Wi-Fi injection NOT claimed — hardware testing required." \
            "" \
            "### ⚠️ Manual Flash Required" \
            "DO NOT flash automatically. Review SHA256 and MARBLE_NETHUNTER_FEATURE_MANIFEST.md." \
            "" \
            "Built by GitHub Actions — Run #${GITHUB_RUN_NUMBER}" \
            > release-notes.md
          gh release create "${tag}" "${all_assets[@]}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Marble EvolutionX NetHunter Daily · r${GITHUB_RUN_NUMBER}" \
            --notes-file release-notes.md
